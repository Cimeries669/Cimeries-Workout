plugins { id 'com.android.application' }

android {
    namespace 'com.cimeries.workout'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cimeries.workout'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The app is a local WebView wrapper. Android Studio's bundled lint can
    // fail on some newer JDK/IDE combinations during signed release builds.
    // Keep release packaging independent from that IDE lint crash.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main.assets.srcDirs = ['src/main/assets']
    }
}

tasks.register('syncWebAssets', Copy) {
    from '../../web'
    into 'src/main/assets/web'
}

preBuild.dependsOn syncWebAssets
